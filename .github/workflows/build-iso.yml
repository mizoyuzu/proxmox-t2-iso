name: build-iso

# Debian 13 netinst + 自作 T2 カーネル .deb → T2 用リマスター ISO。
# カーネルは build-kernel.yml のリリース (タグ) から取得する。
# ※ リマスター手順は試験後に VM で検証してから実戦投入すること。

on:
  workflow_dispatch:
    inputs:
      kernel_tag:
        description: "カーネル .deb のリリースタグ"
        required: true
        default: "kernel-7.0.14-30-pve-t2-r1"

permissions:
  contents: read

jobs:
  remaster:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xorriso cpio fakeroot kmod

      - name: Run offline tests
        run: bash tests/run-all.sh

      - name: Download Debian netinst ISO (current 13.x)
        run: |
          set -euo pipefail
          base="https://cdimage.debian.org/debian-cd/current/amd64/iso-cd"
          sha_sums="$(curl -fsSL "$base/SHA256SUMS")"
          iso="$(printf '%s\n' "$sha_sums" | grep -o 'debian-[0-9.]*-amd64-netinst.iso' | sed -n '1p')"
          test -n "$iso"
          echo "ISO: $iso"
          curl -fL --retry 2 -o "$iso" "$base/$iso"
          printf '%s\n' "$sha_sums" | grep -F "$iso" | sha256sum -c -
          echo "DEBIAN_ISO=$iso" >> "$GITHUB_ENV"

      - name: Download T2 kernel debs from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p debs
          gh release download "${{ inputs.kernel_tag }}" --pattern '*.deb' --dir debs

      - name: Preflight selected PVE T2 image package
        run: |
          set -euo pipefail
          shopt -s nullglob
          candidates=(debs/proxmox-kernel-*-pve-t2_*.deb)
          images=()
          for deb in "${candidates[@]}"; do
            package="$(dpkg-deb -f "$deb" Package)"
            if [[ "$package" =~ ^proxmox-kernel-[0-9][A-Za-z0-9.+~:-]*-pve-t2$ ]] &&
               [[ ! "$package" =~ (headers|signed-template|meta) ]]; then
              images+=("$deb")
            fi
          done
          if (( ${#images[@]} != 1 )); then
            echo "ERROR: expected exactly one proxmox-kernel PVE T2 image deb, found ${#images[@]}" >&2
            printf 'Found: %s\n' "${images[*]:-none}" >&2
            exit 1
          fi
          package="$(dpkg-deb -f "${images[0]}" Package)"
          [[ "$package" =~ ^proxmox-kernel-[0-9][A-Za-z0-9.+~:-]*-pve-t2$ ]]
          [[ ! "$package" =~ (headers|signed-template|meta) ]]
          printf 'Preflight image: %s (%s)\n' "${images[0]}" "$package"

      - name: Firmware policy
        run: |
          set -euo pipefail
          note='Firmware is omitted: set FIRMWARE_DIR for a private/local build; public repository and ISO builds do not include Apple firmware.'
          echo "NOTE: $note"
          echo "NOTE: $note" >> "$GITHUB_STEP_SUMMARY"

      - name: Remaster
        env:
          KERNEL_DEB_DIR: ${{ github.workspace }}/debs
        run: |
          set -euo pipefail
          chmod +x scripts/remaster-iso.sh
          ./scripts/remaster-iso.sh debian-13-t2-proxmox.iso

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-13-t2-proxmox-iso
          path: debian-13-t2-proxmox.iso
          retention-days: 14
