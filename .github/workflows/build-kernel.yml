name: build-kernel

# Proxmox pve-kernel + pinned t2linux patch set. Manually dispatched only.

on:
  workflow_dispatch:
    inputs:
      pve_commit:
        description: "Pinned pve-kernel commit SHA"
        required: true
        default: "1cc9d3c72dff80f433cf090707c52c477d920540"
      t2_commit:
        description: "Pinned linux-t2-patches commit SHA"
        required: true
        default: "7214248ed18659d576cc3a7feda20329d1eefc6f"
      revision:
        description: "Debian package revision"
        required: true
        default: "1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get clean
          docker image prune --all --force
          df -h /

      - name: Validate inputs
        env:
          PVE_COMMIT: ${{ inputs.pve_commit }}
          T2_COMMIT: ${{ inputs.t2_commit }}
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          [[ "$PVE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$T2_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REVISION" =~ ^[1-9][0-9]*$ ]]

      - name: Run offline kernel package tests
        run: |
          bash tests/test-build-kernel-inputs.sh
          bash tests/test-pve-kernel-config.sh

      - name: Build and verify kernel .deb packages
        env:
          PVE_COMMIT: ${{ inputs.pve_commit }}
          T2_COMMIT: ${{ inputs.t2_commit }}
          REVISION: ${{ inputs.revision }}
        run: bash scripts/build-pve-kernel.sh

      - name: Resolve release tag
        id: release-tag
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=(out/proxmox-kernel-*-pve-t2_*.deb)
          shopt -u nullglob
          if [ "${#images[@]}" -ne 1 ]; then
            echo "expected exactly one PVE T2 image package, found ${#images[@]}" >&2
            exit 1
          fi
          bash scripts/verify-pve-kernel.sh "${images[0]}"
          package_name="$(dpkg-deb -f "${images[0]}" Package)"
          kernel_release="${package_name#proxmox-kernel-}"
          tag="kernel-${kernel_release}-r${REVISION}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $tag"

      - name: Upload artifacts
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: pve-t2-kernel-debs-r${{ inputs.revision }}
          path: out/*.deb
          retention-days: 30

      - name: Publish release
        if: ${{ success() }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-tag.outputs.tag }}
          name: Proxmox T2 kernel ${{ steps.release-tag.outputs.tag }}
          files: out/*.deb
          body: |
            Proxmox pve-kernel commit `${{ inputs.pve_commit }}` with t2linux patches `${{ inputs.t2_commit }}`.
            Includes the patched T2 drivers and ZFS for Proxmox VE on Debian 13.
            Package revision: ${{ inputs.revision }}.
