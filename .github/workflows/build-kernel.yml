name: build-kernel

# T2 パッチ済みカーネル (方式A) を .deb 化する。
# 実行場所は GitHub Actions (Mitaさん決定 2026-11-21)。
# 手動実行 (workflow_dispatch) が基本。KVER とパッチブランチは t2linux の
# version ファイルに合わせて更新すること (6.18 ブランチ = KVER 6.18.56 で検証済み)。

on:
  workflow_dispatch:
    inputs:
      kver:
        description: "kernel version (linux-t2-patches の version ファイルと一致させる)"
        required: true
        default: "6.18.56"
      patch_branch:
        description: "linux-t2-patches のブランチ"
        required: true
        default: "6.18"
      revision:
        description: "Debian package revision"
        required: true
        default: "1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: release-tag
        env:
          KVER: ${{ inputs.kver }}
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          if ! [[ "$REVISION" =~ ^[1-9][0-9]*$ ]]; then
            echo "revision must be a positive integer" >&2
            exit 1
          fi
          tag="kernel-${KVER}-t2-pve"
          if [ "$REVISION" != "1" ]; then
            tag="${tag}-r${REVISION}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev libncurses-dev \
            dwarves pahole cpio rsync kmod dpkg-dev debhelper-compat \
            libdw-dev zstd xz-utils

      - name: Build kernel .deb packages
        env:
          KVER: ${{ inputs.kver }}
          PATCH_BRANCH: ${{ inputs.patch_branch }}
          KDEB_REVISION: ${{ inputs.revision }}
        run: |
          chmod +x scripts/build-kernel.sh
          ./scripts/build-kernel.sh

      - name: Upload artifacts
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ inputs.kver }}-t2-pve-r${{ inputs.revision }}
          path: out/*.deb
          retention-days: 30

      - name: Publish release
        if: ${{ success() }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-tag.outputs.tag }}
          name: T2 kernel ${{ inputs.kver }} for Proxmox (Debian 13)
          files: out/*.deb
          body: |
            mainline ${{ inputs.kver }} + linux-t2-patches (${{ inputs.patch_branch }})
            Proxmox ホスト向け config (KVM/VFIO/LXC/bridge + T2 ドライバ)。
            ZFS は含まない (LVM-thin / ext4 前提)。
            Package revision: ${{ inputs.revision }}.
            Includes CONFIG_DM_THIN_PROVISIONING (dm-thin-pool) for PVE local-lvm and CONFIG_FUSE_FS (pmxcfs).
