# Manual-partitioning installer path for MacBookPro15,1 (T2).
# Create the partitions in the partman UI; never run this on a real disk until explicitly approved.

# --- locale / keyboard ---
d-i localechooser/languagelist select ja
d-i debian-installer/language string ja
d-i debian-installer/country string JP
d-i debian-installer/locale string ja_JP.UTF-8
d-i keyboard-configuration/xkb-keymap select jp
d-i time/zone string Asia/Tokyo

# T2 modules are present in the shared installer initrd; NVMe uses the standard driver.
d-i preseed/early_command string modprobe t2bce_core || true; modprobe t2bce_vhci || true
d-i anna/no_kernel_modules boolean true

# --- wired network ---
d-i netcfg/choose_interface select auto
d-i netcfg/use_autoconfig boolean true
d-i netcfg/get_hostname string pve-mbp
d-i netcfg/get_domain string local

# --- mirror ---
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# --- account: ask for the root password interactively ---
d-i passwd/root-login boolean true
d-i passwd/make-user boolean false

# No partman-auto or partman/early_command settings here: partman presents its manual UI.

# --- packages ---
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string lvm2 thin-provisioning-tools sudo curl openssh-server initramfs-tools linux-base busybox
d-i pkgsel/install-language-support boolean false
d-i pkgsel/upgrade select none

# --- bootloader / SSH ---
d-i grub-installer/bootdev string /dev/nvme0n1
d-i grub-installer/only_debian boolean false
d-i grub-installer/force-efi-extra-removable boolean true

# After manual layout is committed, validate it and perform common T2 target setup.
d-i preseed/late_command string /cdrom/t2/scripts/t2-target-setup.sh manual
d-i finish-install/reboot_in_progress note
