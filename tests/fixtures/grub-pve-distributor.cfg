# Generated GRUB menu after Proxmox VE packages have installed.
# The old default is intentionally stale: Debian's 10_linux menu was present
# before the PVE grub integration regenerated this menu.
if [ "${next_entry}" ] ; then
   set default="${next_entry}"
else
   set default="Advanced options for Debian GNU/Linux>Debian GNU/Linux, with Linux 6.18.56-t2-pve"
fi

menuentry 'Proxmox VE GNU/Linux' --class proxmox 'gnulinux-simple-test' {
	linux /vmlinuz-7.0.14-30-pve root=UUID=test ro quiet
	initrd /initrd.img-7.0.14-30-pve
}
submenu 'Advanced options for Proxmox VE GNU/Linux' 'gnulinux-advanced-test' {
	menuentry 'Proxmox VE GNU/Linux, with Linux 7.0.14-30-pve' 'gnulinux-7-advanced-test' {
		linux /vmlinuz-7.0.14-30-pve root=UUID=test ro quiet
		initrd /initrd.img-7.0.14-30-pve
	}
	menuentry 'Proxmox VE GNU/Linux, with Linux 7.0.14-30-pve (recovery mode)' 'gnulinux-7-recovery-test' {
		linux /vmlinuz-7.0.14-30-pve root=UUID=test ro single
		initrd /initrd.img-7.0.14-30-pve
	}
	# Put recovery first so the test fails if recovery entries are not excluded.
	menuentry 'Proxmox VE GNU/Linux, with Linux 6.18.56-t2-pve (recovery mode)' 'gnulinux-t2-recovery-test' {
		linux /vmlinuz-6.18.56-t2-pve root=UUID=test ro single
		initrd /initrd.img-6.18.56-t2-pve
	}
	menuentry 'Proxmox VE GNU/Linux, with Linux 6.18.56-t2-pve' 'gnulinux-t2-advanced-test' {
		linux /vmlinuz-6.18.56-t2-pve root=UUID=test ro quiet
		initrd /initrd.img-6.18.56-t2-pve
	}
}
