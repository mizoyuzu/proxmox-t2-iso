# Generated GRUB menu after Proxmox VE packages have installed.
# Keep the former title default here to verify migration to stable IDs.
if [ "${next_entry}" ] ; then
   set default="${next_entry}"
else
   set default="Advanced options for Debian GNU/Linux>Debian GNU/Linux, with Linux 6.18.56-t2-pve"
fi
if [ "${feature_menuentry_id}" = y ]; then
  set menuentry_id_option="--id"
else
  set menuentry_id_option=""
fi
export menuentry_id_option

# A generic simple ID is not a version-specific T2 choice.
menuentry 'Proxmox VE GNU/Linux' $menuentry_id_option 'gnulinux-simple-fixture-root' {
	linux /vmlinuz-7.0.14-30-pve root=UUID=test ro quiet
	initrd /initrd.img-7.0.14-30-pve
}
submenu 'Advanced options for Proxmox VE GNU/Linux' $menuentry_id_option 'gnulinux-advanced-fixture-root' {
	menuentry 'Proxmox VE GNU/Linux, with Linux 7.0.14-30-pve' $menuentry_id_option 'gnulinux-7.0.14-30-pve-advanced-fixture-root' {
		linux /vmlinuz-7.0.14-30-pve root=UUID=test ro quiet
		initrd /initrd.img-7.0.14-30-pve
	}
	menuentry 'Proxmox VE GNU/Linux, with Linux 6.18.60-t2-pve (recovery mode)' $menuentry_id_option 'gnulinux-6.18.60-t2-pve-recovery-fixture-root' {
		linux /vmlinuz-6.18.60-t2-pve root=UUID=test ro single
		initrd /initrd.img-6.18.60-t2-pve
	}
	menuentry 'Proxmox VE GNU/Linux, with Linux 6.18.60-t2-pve' $menuentry_id_option 'gnulinux-6.18.60-t2-pve-advanced-fixture-root' {
		linux /vmlinuz-6.18.60-t2-pve root=UUID=test ro quiet
		initrd /initrd.img-6.18.60-t2-pve
	}
	menuentry 'Proxmox VE GNU/Linux, with Linux 6.18.56-t2-pve (recovery mode)' $menuentry_id_option 'gnulinux-6.18.56-t2-pve-recovery-fixture-root' {
		linux /vmlinuz-6.18.56-t2-pve root=UUID=test ro single
		initrd /initrd.img-6.18.56-t2-pve
	}
	menuentry 'Proxmox VE GNU/Linux, with Linux 6.18.56-t2-pve' $menuentry_id_option 'gnulinux-6.18.56-t2-pve-advanced-fixture-root' {
		linux /vmlinuz-6.18.56-t2-pve root=UUID=test ro quiet
		initrd /initrd.img-6.18.56-t2-pve
	}
}
