# preseed.cfg — T2 Debian installer for MacBookPro15,1 (DRAFT, 未検証)
# 目的: macOS を縮めて空けた「最大の連続空き領域」にだけ LVM (VG pve) で入れる。
# 既存パーティション (macOS / Data / Ubuntu) には触らないこと。
# 注意: 実行前に必ず VM でドライランし、partman の挙動を確認すること。

# --- locale / keyboard (コンソールは T2 SPI キーボード) ---
d-i debian-installer/locale string ja_JP.UTF-8
d-i keyboard-configuration/xkb-keymap select jp

# --- network (インストーラ initrd に Wi-Fi fw 同梱済み前提。有線があればそちら優先) ---
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string pve-mbp
d-i netcfg/get_domain string local

# --- mirror ---
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# --- account (root パスワードは preseed に平文で置かない。SSH 鍵か対話で設定) ---
d-i passwd/root-login boolean true
d-i passwd/make-user boolean false

# --- partitioning: 最大の連続空き領域に自動で入れる ---
d-i partman-auto/init_automatically_partition select biggest_free
d-i partman-auto/method string lvm
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-lvm/confirm boolean true
d-i partman-auto-lvm/new_vg_name string pve
# レシピ: 公式インストーラ風 (root LV + swap + thin pool 用空き)。
# thin pool 自体は初回起動側で lvcreate -T する方が柔軟なので、ここでは VG と root/swap のみ作り残りを空けておく案もあり。要検討。
d-i partman-auto/expert_recipe string \
  pve-lvm :: \
    512 512 512 ext4 \
      $primary{ } $bootable{ } \
      method{ format } format{ } use_filesystem{ } filesystem{ ext4 } \
      mountpoint{ /boot } \
    . \
    4096 4096 4096 linux-swap \
      $lvmok{ } lv_name{ swap } \
      method{ swap } format{ } \
    . \
    20480 100000 -1 ext4 \
      $lvmok{ } lv_name{ root } \
      method{ format } format{ } use_filesystem{ } filesystem{ ext4 } \
      mountpoint{ / } \
    .
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# --- packages ---
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string lvm2 thin-provisioning-tools sudo curl
d-i pkgsel/upgrade select none

# --- bootloader: 既存 ESP を使い、Ubuntu と別 ID で登録する想定。要検証 ---
d-i grub-installer/only_debian boolean false
d-i grub-installer/bootdev string default

# --- late_command: ファームウェアと T2 追加物を配置 ---
# /cdrom/t2/ に firmware/brcm/*.bin 等、カスタムカーネル .deb、設定ファイルを同梱する想定。
d-i preseed/late_command string \
  mkdir -p /target/lib/firmware/brcm; \
  cp -a /cdrom/t2/firmware/brcm/brcmfmac4364* /cdrom/t2/firmware/brcm/brcmbt4377* /target/lib/firmware/brcm/ 2>/dev/null || true; \
  cp -a /cdrom/t2/config/modules-load.d/* /target/etc/modules-load.d/ 2>/dev/null || true; \
  cp -a /cdrom/t2/config/modprobe.d/* /target/etc/modprobe.d/ 2>/dev/null || true; \
  in-target dpkg -i /media/cdrom/t2/debs/*.deb || true

d-i finish-install/reboot_in_progress note
