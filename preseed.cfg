# preseed.cfg — MacBookPro15,1 (T2) 向け Debian 13 インストール設定
# 対象ディスクの最大の連続空き領域だけを使う。既存の macOS / Ubuntu パーティションには触れない。
# 実機や実ディスクでは実行せず、VM のドライランで partman の表示を必ず確認すること。

# --- locale / keyboard ---
# シリアルコンソールでは言語候補が level 0 (C/英語) に絞られるため、質問自体に日本語を直接設定する。
d-i localechooser/languagelist select ja
d-i debian-installer/language string ja
d-i debian-installer/country string JP
d-i debian-installer/locale string ja_JP.UTF-8
d-i keyboard-configuration/xkb-keymap select jp
d-i time/zone string Asia/Tokyo

# --- T2 モジュール (NVMe SSD は標準 NVMe ドライバを使う) ---
d-i preseed/early_command string modprobe t2bce_core || true; modprobe t2bce_vhci || true

# T2 カーネルを installer kernel に使うため、CD のモジュール udeb は ABI 不一致。
# 必要なモジュールは initrd に同梱済みなので、anna の警告を自動で続行する。
# Template: anna/no_kernel_modules (Default: false)
d-i anna/no_kernel_modules boolean true

# --- 有線ネットワークのみ ---
d-i netcfg/choose_interface select auto
d-i netcfg/use_autoconfig boolean true
d-i netcfg/get_hostname string pve-mbp
d-i netcfg/get_domain string local

# --- mirror ---
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# --- account ---
# root のパスワードは preseed しない。インストーラが対話で尋ねる重要な質問に入力する。
# root のみ作成し、一般ユーザーは作成しない。
d-i passwd/root-login boolean true
d-i passwd/make-user boolean false

# --- partitioning: 最大空き領域内に通常パーティションと LVM 予約領域を作る ---
# 既存パーティションと既存 ESP は保持し、最大の連続空き領域だけを使う。
# 新しい ESP を作成する (既存 ESP の再利用を示す $reusemethod は指定しない)。
# /boot・swap・root は通常パーティション、残りを Linux LVM type の PV 予約パーティションにする。
# partman はこの予約領域から VG を作らないため、late_command で pve を作成する。
# thin pool は first-boot-proxmox.service の初回起動時に作成する。
d-i partman-auto/disk string /dev/nvme0n1
d-i partman-auto/init_automatically_partition select biggest_free
d-i partman-auto/choose_recipe select pve-final
d-i partman-lvm/device_remove_lvm boolean false
d-i partman-md/device_remove_md boolean false
d-i partman-auto/purge_lvm_from_device boolean false
d-i partman-auto/expert_recipe string \
  pve-final :: \
    512 512 512 free \
      $iflabel{ gpt } method{ efi } format{ } \
    . \
    1024 1536 1536 ext4 \
      $primary{ } $bootable{ } \
      method{ format } format{ } use_filesystem{ } filesystem{ ext4 } \
      mountpoint{ /boot } \
    . \
    4096 4096 4096 linux-swap \
      method{ swap } format{ } \
    . \
    20480 20480 32768 ext4 \
      method{ format } format{ } use_filesystem{ } filesystem{ ext4 } \
      mountpoint{ / } \
    . \
    1 1 -1 free \
      $primary{ } method{ lvm } vg_name{ pve } \
    .
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# --- packages ---
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string lvm2 thin-provisioning-tools sudo curl openssh-server initramfs-tools linux-base
d-i pkgsel/install-language-support boolean false
d-i pkgsel/upgrade select none

# --- bootloader ---
# 既存の macOS / Ubuntu ESP は変更せず、空き領域に新設する ESP のみを使う。
# T2 の起動ピッカーでの表示や EFI removable-media fallback は VM/実機で別途確認する。
d-i grub-installer/bootdev string /dev/nvme0n1
d-i grub-installer/only_debian boolean false
d-i grub-installer/force-efi-extra-removable boolean true

# --- late_command: 未使用の Linux LVM 予約領域を検出して VG pve を作成する ---
# /run/udev/data の partition record に DEVNAME はないため、disk/type/number で新しい PV を特定する。
# ID_FS_TYPE がある領域は既存署名として保護し、候補が一意でない場合は安全のため停止する。
d-i preseed/late_command string \
  set -e; \
  echo '=== T2: creating LVM VG pve ==='; \
  dev=/dev/nvme0n1; \
  diskno=$(cat /sys/class/block/$(basename "$dev")/dev); \
  candidates=; existing=; \
  for f in /run/udev/data/b*; do \
    [ -f "$f" ] || continue; \
    type=$(sed -n 's/^E:ID_PART_ENTRY_TYPE=//p' "$f"); \
    [ "$type" = e6d6d379-f507-44c2-a23c-238f2a3df928 ] || continue; \
    disk=$(sed -n 's/^E:ID_PART_ENTRY_DISK=//p' "$f"); \
    [ "$disk" = "$diskno" ] || continue; \
    num=$(sed -n 's/^E:ID_PART_ENTRY_NUMBER=//p' "$f"); \
    fs=$(sed -n 's/^E:ID_FS_TYPE=//p' "$f"); \
    [ -n "$num" ] || { echo "ERROR: no partition number in $f"; exit 1; }; \
    if [ -z "$fs" ]; then \
      echo "LVM candidate: ${dev}p${num}"; \
      candidates="$candidates ${dev}p${num}"; \
    else \
      echo "Skipping existing LVM PV ${dev}p${num} (ID_FS_TYPE=$fs)"; \
      existing="$existing ${dev}p${num}"; \
    fi; \
  done; \
  set -- $candidates; \
  if [ $# -ne 1 ]; then \
    echo "ERROR: expected exactly one unused Linux LVM partition, found $# (candidates=[$candidates], existing=[$existing])"; \
    exit 1; \
  fi; \
  pv=$1; \
  echo "Creating VG pve on $pv"; \
  test -b "$pv" || { echo "ERROR: $pv is not a block device"; exit 1; }; \
  fstype=$(blkid -p -o value -s TYPE "$pv" 2>/dev/null || true); \
  [ -z "$fstype" ] || { echo "ERROR: signature ($fstype) found on $pv"; exit 1; }; \
  if awk -v d="$pv" '$1==d{found=1} END{exit !found}' /proc/mounts; then \
    echo "ERROR: $pv is mounted"; exit 1; \
  fi; \
  if vgs pve >/dev/null 2>&1; then \
    echo "ERROR: VG pve already exists"; exit 1; \
  fi; \
  pvcreate --yes "$pv"; \
  vgcreate pve "$pv"; \
  mkdir -p /target/usr/local/sbin /target/etc/systemd/system /target/tmp/t2-debs; \
  cp /cdrom/t2/scripts/first-boot-proxmox.sh /target/usr/local/sbin/first-boot-proxmox.sh; \
  chmod 0755 /target/usr/local/sbin/first-boot-proxmox.sh; \
  cp /cdrom/t2/systemd/first-boot-proxmox.service /target/etc/systemd/system/first-boot-proxmox.service; \
  cp /cdrom/t2/debs/linux-image-*.deb /target/tmp/t2-debs/; \
  in-target sh -c 'apt-get install -y /tmp/t2-debs/*.deb'; \
  ls /target/boot/vmlinuz-*-t2-pve >/dev/null; \
  ls /target/boot/initrd.img-*-t2-pve >/dev/null; \
  in-target systemctl enable ssh.service; \
  in-target systemctl enable first-boot-proxmox.service; \
  mkdir -p /target/etc/ssh/sshd_config.d; \
  printf '%s\n' 'PermitRootLogin yes' 'PasswordAuthentication yes' > /target/etc/ssh/sshd_config.d/10-t2.conf; \
  if [ -f /cdrom/t2/ssh/authorized_keys ]; then mkdir -p /target/root/.ssh; cp /cdrom/t2/ssh/authorized_keys /target/root/.ssh/authorized_keys; chmod 0700 /target/root/.ssh; chmod 0600 /target/root/.ssh/authorized_keys; echo 'Optional authorized_keys installed.'; else echo 'Optional authorized_keys not present; use the interactive root password.'; fi; \
  if [ -d /cdrom/t2/firmware/brcm ]; then mkdir -p /target/lib/firmware/brcm; cp -a /cdrom/t2/firmware/brcm/. /target/lib/firmware/brcm/; echo 'Optional Broadcom firmware copied.'; else echo 'Optional Broadcom firmware not present.'; fi; \
  rm -f /target/tmp/t2-debs/*.deb; \
  rmdir /target/tmp/t2-debs

# インストール完了後の自動再起動通知。
d-i finish-install/reboot_in_progress note
