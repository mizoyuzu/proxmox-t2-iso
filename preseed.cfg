# preseed.cfg — MacBookPro15,1 (T2) 向け Debian 13 インストール設定
# 対象ディスクの最大の連続空き領域だけを使う。既存の macOS / Ubuntu パーティションには触れない。
# 実機や実ディスクでは実行せず、VM のドライランで partman の表示を必ず確認すること。

# --- locale / keyboard ---
# シリアルコンソールでは言語候補が level 0 (C/英語) に絞られるため、質問自体に日本語を直接設定する。
d-i localechooser/languagelist select ja
d-i debian-installer/language string ja
d-i debian-installer/country string JP
d-i debian-installer/locale string ja_JP.UTF-8
d-i keyboard-configuration/xkb-keymap select jp
d-i time/zone string Asia/Tokyo

# --- T2 モジュール (NVMe SSD は標準 NVMe ドライバを使う) ---
d-i preseed/early_command string modprobe t2bce_core || true; modprobe t2bce_vhci || true

# T2 カーネルを installer kernel に使うため、CD のモジュール udeb は ABI 不一致。
# 必要なモジュールは initrd に同梱済みなので、anna の警告を自動で続行する。
# Template: anna/no_kernel_modules (Default: false)
d-i anna/no_kernel_modules boolean true

# --- 有線ネットワークのみ ---
d-i netcfg/choose_interface select auto
d-i netcfg/use_autoconfig boolean true
d-i netcfg/get_hostname string pve-mbp
d-i netcfg/get_domain string local

# --- mirror ---
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# --- account ---
# root のパスワードは preseed しない。インストーラが対話で尋ねる重要な質問に入力する。
# root のみ作成し、一般ユーザーは作成しない。
d-i passwd/root-login boolean true
d-i passwd/make-user boolean false

# --- partitioning: 対象 NVMe の最大空き領域を検証して使用する ---
# 既存パーティションと既存 ESP は保持し、最大の連続空き領域だけを使う。
# 新しい ESP を作成する (既存 ESP の再利用を示す $reusemethod は指定しない)。
# /boot・swap・root は通常パーティション、残りを Linux LVM type の PV 予約パーティションにする。
# partman はこの予約領域から VG を作らないため、late_command で pve を作成する。
# thin pool は first-boot-proxmox.service の初回起動時に作成する。
# display.d/09t2guard は Debian biggest_free の全ディスク候補を再利用し、
# 選択先が GPT の /dev/nvme0n1 であることと、pve-final レシピに必要な空き容量を確認する。
d-i partman/early_command string \
  test -r /cdrom/t2/scripts/partman-t2-guard.sh && \
    mkdir -p /lib/partman/display.d && \
    cp /cdrom/t2/scripts/partman-t2-guard.sh /lib/partman/display.d/09t2guard && \
    chmod 0755 /lib/partman/display.d/09t2guard
d-i partman-auto/disk string /dev/nvme0n1
d-i partman-auto/init_automatically_partition select biggest_free
d-i partman-auto/choose_recipe select pve-final
d-i partman-lvm/device_remove_lvm boolean false
d-i partman-md/device_remove_md boolean false
d-i partman-auto/purge_lvm_from_device boolean false
d-i partman-auto/expert_recipe string \
  pve-final :: \
    512 512 512 free \
      $iflabel{ gpt } method{ efi } format{ } \
    . \
    2048 2048 2048 ext4 \
      $primary{ } $bootable{ } \
      method{ format } format{ } use_filesystem{ } filesystem{ ext4 } \
      mountpoint{ /boot } \
    . \
    4096 4096 4096 linux-swap \
      method{ swap } format{ } \
    . \
    20480 20480 32768 ext4 \
      method{ format } format{ } use_filesystem{ } filesystem{ ext4 } \
      mountpoint{ / } \
    . \
    1 1 -1 free \
      $primary{ } method{ lvm } vg_name{ pve } \
    .
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# --- packages ---
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string lvm2 thin-provisioning-tools sudo curl openssh-server initramfs-tools linux-base busybox
d-i pkgsel/install-language-support boolean false
d-i pkgsel/upgrade select none

# --- bootloader ---
# 既存の macOS / Ubuntu ESP は変更せず、空き領域に新設する ESP のみを使う。
# T2 の起動ピッカーでの表示や EFI removable-media fallback は VM/実機で別途確認する。
d-i grub-installer/bootdev string /dev/nvme0n1
d-i grub-installer/only_debian boolean false
d-i grub-installer/force-efi-extra-removable boolean true

# 共通の target 処理は一つのスクリプトへ集約。partman guard は自動経路のみ。
d-i preseed/late_command string /cdrom/t2/scripts/t2-target-setup.sh auto

# インストール完了後の自動再起動通知。
d-i finish-install/reboot_in_progress note
